<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Dzienniczek snu</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sen">
<meta name="theme-color" content="#101320">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{
  --bg:#101320; --surf:#191D2E; --surf2:#232842; --line:#2C3252;
  --text:#E9E6DE; --muted:#868CA8; --amber:#E8B15C; --cool:#7A9BD1; --bad:#D97070;
  --fd: ui-serif,"New York",Georgia,serif;
  --fb: -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--fb);
  padding:max(22px,env(safe-area-inset-top)) 16px calc(44px + env(safe-area-inset-bottom));
  max-width:520px;margin:0 auto;font-size:15px}
h1{font-family:var(--fd);font-size:32px;margin:4px 0 0;font-weight:400}
.eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--amber);font-weight:600}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.lab{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;display:block;margin-bottom:6px}
.num{font-variant-numeric:tabular-nums}
input,textarea{width:100%;background:var(--surf2);border:1px solid var(--line);border-radius:9px;
  color:var(--text);padding:11px 12px;font-size:16px;font-family:var(--fb);outline:none;
  -webkit-appearance:none;font-variant-numeric:tabular-nums}
textarea{resize:none;font-variant-numeric:normal}
input[type=time]{padding:11px 6px;font-size:15px;text-align:center}
button{font-family:var(--fb);cursor:pointer;border:none}
.btn{background:var(--amber);color:#1A1508;border-radius:12px;padding:15px;font-size:16px;font-weight:600;width:100%}
.ghost{background:var(--surf2);color:var(--cool);border:1px solid var(--line);border-radius:11px;padding:12px;font-size:14px;width:100%}
.row{display:flex;gap:8px}
.row>*{flex:1}
.mb{margin-bottom:14px}
.tabs{display:flex;gap:6px;margin-bottom:14px;background:var(--surf);padding:4px;border-radius:12px;border:1px solid var(--line)}
.tabs button{flex:1;background:transparent;color:var(--muted);border-radius:9px;padding:10px 6px;font-size:13px}
.tabs button.on{background:var(--surf2);color:var(--text);font-weight:600}
.strip{display:flex;gap:6px;overflow-x:auto;padding:0 6px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.day{flex-shrink:0;width:46px;background:transparent;color:var(--muted);border:1px solid var(--line);
  border-radius:10px;padding:8px 0;font-variant-numeric:tabular-nums;text-align:center}
.day.done{background:var(--surf2);color:var(--text)}
.day.on{background:var(--amber);color:#1A1508;border-color:var(--amber)}
.day .d1{font-size:9px;opacity:.8}.day .d2{font-size:14px;font-weight:600;margin-top:1px}.day .d3{font-size:8px;margin-top:2px}
input[type=range]{-webkit-appearance:none;background:transparent;padding:0;border:none}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--line);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-12px;border-radius:50%;background:var(--amber)}
.pill{background:var(--surf2);color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:9px 2px;font-size:11px;flex:1}
.pill.on{background:var(--cool);color:#0D1220;font-weight:600;border-color:var(--cool)}
.opt{text-align:left;background:var(--surf2);color:var(--text);border:1px solid var(--line);
  border-radius:9px;padding:10px 12px;font-size:14px;width:100%;margin-bottom:5px}
.opt.on{background:var(--cool);color:#0D1220;font-weight:600;border-color:var(--cool)}
.hint{font-size:10px;color:var(--muted);margin-top:3px}
.tl{position:relative;padding-top:4px}
.tlrow{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.tlrow .dt{width:40px;font-size:10px;color:var(--muted);flex-shrink:0;font-variant-numeric:tabular-nums}
.bar{position:relative;flex:1;height:14px}
.stat{flex:1}.stat .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat .v{font-size:16px;margin-top:3px;font-variant-numeric:tabular-nums}
.mini{font-size:11px;color:var(--muted);line-height:1.6}
button:focus-visible,input:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="eyebrow">20.08 – 18.09.2026</div>
<h1>Dzienniczek snu</h1>
<div class="tabs" id="tabs"></div>
<div id="app"></div>

<script>
"use strict";
/* ---------- dane ---------- */
var START="2026-08-20", DAYS=30;
var DOW=["nd","pn","wt","śr","cz","pt","sb"];
var DIST=[["a","Nie mogę zasnąć w ciągu 30 minut"],["b","Budzę się w środku nocy lub nad ranem"],
["c","Muszę wstać do toalety"],["d","Nie mogę swobodnie oddychać"],["e","Kaszlę lub głośno chrapię"],
["f","Jest mi za zimno"],["g","Jest mi za gorąco"],["h","Mam złe sny"],["i","Odczuwam ból"],["j","Inny powód"]];
var COMPN=["Subiektywna jakość snu","Latencja zasypiania","Długość snu","Efektywność snu",
"Zaburzenia snu","Leki nasenne","Funkcjonowanie w dzień"];
var FREQ=["Ani razu","Rzadziej niż raz w tygodniu","Raz lub dwa razy w tygodniu","Trzy razy w tygodniu lub częściej"];

function dISO(i){var d=new Date(START+"T00:00:00");d.setDate(d.getDate()+i);return d.toISOString().slice(0,10);}
var DATES=[];for(var i=0;i<DAYS;i++)DATES.push(dISO(i));

function toMin(t){if(!t)return null;var p=t.split(":");return +p[0]*60+ +p[1];}
function m2t(m){m=Math.round(m);return String(Math.floor(m/60)%24).padStart(2,"0")+":"+String(m%60).padStart(2,"0");}
function dur(m){return Math.floor(m/60)+" godz "+String(Math.round(m%60)).padStart(2,"0")+" min";}
function pl(d){var x=new Date(d+"T00:00:00");return String(x.getDate()).padStart(2,"0")+"."+String(x.getMonth()+1).padStart(2,"0")+"."+x.getFullYear();}
function sh(d){var x=new Date(d+"T00:00:00");return String(x.getDate()).padStart(2,"0")+"."+String(x.getMonth()+1).padStart(2,"0");}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

function blankDay(date){return{date:date,bed:"",asleep:"",wakes:[],up:"",naps:"",
  pregHour:S.meds.pregHour||"",pregDose:S.meds.pregDose||"",tritHour:S.meds.tritHour||"",tritDose:S.meds.tritDose||"",
  coffeeN:"",coffeeLast:"",mood:5,sleepiness:5,nightScore:5,notes:""};}
function filled(d){return !!(d&&(d.up||d.asleep||d.bed));}

function calc(d){
  var bed=toMin(d.bed),as=toMin(d.asleep),up=toMin(d.up);
  if(bed===null||up===null)return null;
  var bedAbs=bed>=720?bed:bed+1440;
  var tib=((up-bed+1440)%1440)||1440;
  var waso=(d.wakes||[]).reduce(function(s,w){var a=toMin(w.from),b=toMin(w.to);
    return (a===null||b===null)?s:s+((b-a+1440)%1440);},0);
  var sol=as!==null?((as-bed+1440)%1440):0;
  var tst=Math.max(0,tib-sol-waso);
  return {bedAbs:bedAbs,tib:tib,tst:tst,waso:waso,sol:sol,eff:tib?(tst/tib*100):0};
}
function wakesTxt(w){return (w||[]).filter(function(x){return x.from;})
  .map(function(x){return x.to?x.from+"–"+x.to:x.from;}).join(", ");}

/* ---------- stan ---------- */
var S={tab:"dziennik",sel:null,diary:{},meds:{},psqi:[],medsOpen:false,psqiOpen:false,p:null};
function load(){
  try{S.diary=JSON.parse(localStorage.getItem("sen.diary")||"{}");}catch(e){}
  try{S.meds=JSON.parse(localStorage.getItem("sen.meds")||"{}");}catch(e){}
  try{S.psqi=JSON.parse(localStorage.getItem("sen.psqi")||"[]");}catch(e){}
}
function save(){
  try{
    localStorage.setItem("sen.diary",JSON.stringify(S.diary));
    localStorage.setItem("sen.meds",JSON.stringify(S.meds));
    localStorage.setItem("sen.psqi",JSON.stringify(S.psqi));
  }catch(e){alert("Nie udało się zapisać. Sprawdź, czy przeglądarka nie działa w trybie prywatnym.");}
}
function cur(){if(!S.diary[S.sel])S.diary[S.sel]=blankDay(S.sel);return S.diary[S.sel];}

/* ---------- PSQI ---------- */
function blankPsqi(){var d={};DIST.forEach(function(x){d[x[0]]=0;});
  return{month:new Date().toISOString().slice(0,7),q1:"23:00",q2:"20",q3:"06:30",q4:"6",
  q5:d,q5jText:"",q6:1,q7:0,q8:0,q9:1};}
function scorePsqi(p){
  var c1=+p.q6;
  var mp=(+p.q2||0)<=15?0:(+p.q2<=30?1:(+p.q2<=60?2:3));
  var s2=mp+(+p.q5.a||0), c2=s2===0?0:(s2<=2?1:(s2<=4?2:3));
  var h=+p.q4||0, c3=h>7?0:(h>=6?1:(h>=5?2:3));
  var bed=toMin(p.q1),up=toMin(p.q3);
  var tibH=(bed!==null&&up!==null)?(((up-bed+1440)%1440)||1440)/60:0;
  var eff=tibH?(h/tibH*100):0, c4=eff>=85?0:(eff>=75?1:(eff>=65?2:3));
  var ds=DIST.slice(1).reduce(function(s,x){return s+(+p.q5[x[0]]||0);},0);
  var c5=ds===0?0:(ds<=9?1:(ds<=18?2:3));
  var c6=+p.q7, s7=(+p.q8||0)+(+p.q9||0), c7=s7===0?0:(s7<=2?1:(s7<=4?2:3));
  var comps=[c1,c2,c3,c4,c5,c6,c7];
  return {comps:comps,total:comps.reduce(function(a,b){return a+b;},0)};
}

/* ---------- render ---------- */
function render(){
  document.getElementById("tabs").innerHTML=
    ['<button data-act="tab" data-v="dziennik" class="'+(S.tab==="dziennik"?"on":"")+'">30 dni</button>',
     '<button data-act="tab" data-v="psqi" class="'+(S.tab==="psqi"?"on":"")+'">PSQI</button>'].join("");
  document.getElementById("app").innerHTML = S.tab==="dziennik"?viewDiary():viewPsqi();
}

function viewStrip(){
  var n=DATES.filter(function(x){return filled(S.diary[x]);}).length;
  var h='<div class="card" style="padding:14px 10px">'+
    '<div style="display:flex;justify-content:space-between;padding:0 6px 9px">'+
    '<span class="lab" style="margin:0">Dzień</span>'+
    '<span class="mini num">'+n+' / '+DAYS+' wypełnionych</span></div><div class="strip">';
  DATES.forEach(function(x){
    var on=x===S.sel, done=filled(S.diary[x]);
    h+='<button class="day'+(done?" done":"")+(on?" on":"")+'" data-act="day" data-v="'+x+'">'+
      '<div class="d1">'+DOW[new Date(x+"T00:00:00").getDay()]+'</div>'+
      '<div class="d2">'+sh(x).slice(0,2)+'</div>'+
      '<div class="d3">'+(done?"●":"○")+'</div></button>';
  });
  return h+'</div></div>';
}

function viewStats(){
  var c=calc(cur());
  if(!c)return '<div id="stats"></div>';
  return '<div id="stats"><div class="card row">'+
    '<div class="stat"><div class="k">W łóżku</div><div class="v">'+dur(c.tib)+'</div></div>'+
    '<div class="stat"><div class="k">Sen</div><div class="v">'+dur(c.tst)+'</div></div>'+
    '<div class="stat"><div class="k">Efektywność</div><div class="v" style="color:'+(c.eff<85?"var(--amber)":"var(--text)")+'">'+
    c.eff.toFixed(0)+'%</div></div></div></div>';
}

function viewForm(){
  var d=cur(), c=calc(d);
  var h='<div class="card"><span class="lab">Noc z '+pl(S.sel)+'</span>';
  h+='<div class="row mb">';
  [["bed","Położyłem się"],["asleep","Zasnąłem"],["up","Wstałem"]].forEach(function(f){
    h+='<div><span class="lab">'+f[1]+'</span><input type="time" data-f="'+f[0]+'" value="'+esc(d[f[0]])+'"></div>';
  });
  h+='</div>';

  h+='<div class="mb"><span class="lab">Wybudzenia w nocy</span>';
  (d.wakes||[]).forEach(function(w,i){
    h+='<div style="display:flex;gap:7px;align-items:center;margin-bottom:7px">'+
      '<input type="time" data-w="'+i+'" data-side="from" value="'+esc(w.from)+'">'+
      '<span style="color:var(--muted)">–</span>'+
      '<input type="time" data-w="'+i+'" data-side="to" value="'+esc(w.to)+'">'+
      '<button data-act="delwake" data-v="'+i+'" style="background:transparent;color:var(--bad);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13px">✕</button></div>';
  });
  h+='<button class="ghost" data-act="addwake">+ Dodaj wybudzenie</button>';
  if(c&&c.waso>0)h+='<div class="mini num" style="margin-top:8px">Czuwanie łącznie: '+dur(c.waso)+'</div>';
  h+='</div>';

  h+='<div class="mb"><span class="lab">Drzemki w dzień</span>'+
    '<input data-f="naps" placeholder="np. 20 min ok. 14:00" style="font-variant-numeric:normal" value="'+esc(d.naps)+'"></div>';

  /* leki */
  h+='<div class="card mb" style="background:var(--surf2);padding:13px">'+
    '<div style="display:flex;justify-content:space-between;align-items:center'+(S.medsOpen?";margin-bottom:12px":"")+'">'+
    '<div><div class="lab" style="margin:0">Leki</div><div class="num" style="font-size:13px;margin-top:4px">'+
    ((d.pregHour||d.tritHour)?("Pregabalina "+esc(d.pregHour||"—")+" "+esc(d.pregDose||"")+" · Trittico "+esc(d.tritHour||"—")+" "+esc(d.tritDose||"")):"Nie uzupełniono")+
    '</div></div><button data-act="meds" style="background:transparent;color:var(--cool);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12px">'+
    (S.medsOpen?"Zwiń":"Zmień")+'</button></div>';
  if(S.medsOpen){
    [["preg","Pregabalina"],["trit","Trittico"]].forEach(function(f){
      h+='<div class="row" style="margin-bottom:10px">'+
        '<div><span class="lab">'+f[1]+' – godz.</span><input type="time" data-f="'+f[0]+'Hour" style="background:var(--surf)" value="'+esc(d[f[0]+"Hour"])+'"></div>'+
        '<div><span class="lab">Dawka</span><input data-f="'+f[0]+'Dose" placeholder="np. 75 mg" style="background:var(--surf);font-variant-numeric:normal" value="'+esc(d[f[0]+"Dose"])+'"></div></div>';
    });
    h+='<button class="ghost" data-act="savemeds" style="background:var(--surf)">Zapamiętaj jako domyślne</button>';
  }
  h+='</div>';

  h+='<div class="row mb">'+
    '<div><span class="lab">Kawa – liczba</span><input type="number" inputmode="numeric" data-f="coffeeN" value="'+esc(d.coffeeN)+'"></div>'+
    '<div><span class="lab">Ostatnia kawa</span><input type="time" data-f="coffeeLast" value="'+esc(d.coffeeLast)+'"></div></div>';

  [["mood","Samopoczucie rano","0 = bardzo źle · 10 = bardzo dobrze"],
   ["sleepiness","Senność rano","0 = brak · 10 = bardzo trudno się dobudzić"],
   ["nightScore","Ocena nocy","0 = bardzo zła · 10 = bardzo dobra"]].forEach(function(f){
    h+='<div style="margin-bottom:15px"><span class="lab" id="lab-'+f[0]+'">'+f[1]+' — '+d[f[0]]+'/10</span>'+
      '<input type="range" min="0" max="10" data-f="'+f[0]+'" data-lab="'+f[1]+'" value="'+d[f[0]]+'">'+
      '<div class="hint">'+f[2]+'</div></div>';
  });

  h+='<span class="lab">Uwagi</span><textarea rows="2" data-f="notes" placeholder="np. stres, ból pleców, hałas, nietypowy dzień">'+esc(d.notes)+'</textarea>';
  return h+'</div>';
}

function viewTimeline(){
  var rows=DATES.map(function(x){var d=S.diary[x];return d?{x:x,d:d,c:calc(d)}:null;})
    .filter(function(r){return r&&r.c;});
  if(!rows.length)return '<div id="tl"></div>';
  var h='<div id="tl"><div class="card"><span class="lab">Przebieg nocy · 18:00 → 12:00</span><div class="tl">';
  [0,6,12,18].forEach(function(i){
    h+='<div style="position:absolute;left:'+(44+(i/18)*56)+'%;top:0;bottom:0;width:1px;background:var(--line)"></div>';
  });
  rows.forEach(function(r){
    var pos=function(a){return Math.max(0,Math.min(100,(a-1080)/1080*100));};
    var L=pos(r.c.bedAbs), W=Math.min(100-L,r.c.tib/1080*100);
    h+='<div class="tlrow"><div class="dt">'+sh(r.x)+'</div><div class="bar">'+
      '<div style="position:absolute;left:'+L+'%;width:'+W+'%;height:14px;border-radius:3px;background:var(--amber);opacity:.85"></div>';
    if(r.c.sol>0)h+='<div style="position:absolute;left:'+L+'%;width:'+(r.c.sol/1080*100)+'%;height:14px;border-radius:3px 0 0 3px;background:var(--cool);opacity:.7"></div>';
    (r.d.wakes||[]).forEach(function(w){
      var a=toMin(w.from),b=toMin(w.to);if(a===null||b===null)return;
      var aAbs=a>=720?a:a+1440;
      h+='<div style="position:absolute;left:'+pos(aAbs)+'%;width:'+Math.max(1.2,((b-a+1440)%1440)/1080*100+
        '')+'%;height:14px;background:var(--bg);border-left:1px solid var(--bad);border-right:1px solid var(--bad)"></div>';
    });
    h+='</div></div>';
  });
  h+='</div><div style="display:flex;gap:14px;margin-top:10px;flex-wrap:wrap" class="mini">'+
    '<span><b style="color:var(--cool)">■</b> zasypianie</span>'+
    '<span><b style="color:var(--amber)">■</b> sen</span>'+
    '<span><b style="color:var(--bad)">▮</b> wybudzenie</span></div></div></div>';
  return h;
}

function viewDiary(){
  return viewStrip()+viewStats()+viewForm()+viewTimeline()+
    '<button class="btn" data-act="export">Pobierz arkusz dla lekarza</button>'+
    '<p class="mini" style="text-align:center;margin:10px 0 18px">Plik CSV w układzie formularza — otwiera się w Excelu. '+
    'Trzy dodatkowe kolumny na końcu: czas w łóżku, czas snu, efektywność.</p>'+
    '<div class="card"><span class="lab">Kopia zapasowa</span>'+
    '<div class="row" style="margin-bottom:10px">'+
    '<button class="ghost" data-act="backup">Zapisz kopię</button>'+
    '<button class="ghost" data-act="restore">Wczytaj kopię</button></div>'+
    '<input type="file" id="restoreFile" accept=".json,application/json" style="display:none">'+
    '<p class="mini">Plik .json ze wszystkimi wpisami. Rób to raz w tygodniu i zapisuj w Plikach '+
    'lub na OneDrive. To jedyna kopia, która przetrwa wyczyszczenie pamięci przeglądarki.</p></div>';
}

/* ---------- PSQI widok ---------- */
function viewPsqi(){
  var h="";
  var sc=S.psqi.map(function(x){return{p:x,s:scorePsqi(x)};}).sort(function(a,b){return a.p.month<b.p.month?1:-1;});
  if(sc.length&&!S.psqiOpen){
    var c=sc[0];
    h+='<div class="card"><span class="lab">'+c.p.month+'</span>'+
      '<div style="display:flex;align-items:baseline;gap:10px">'+
      '<div class="num" style="font-size:54px;line-height:1;font-weight:300;color:'+(c.s.total>5?"var(--amber)":"var(--text)")+'">'+
      c.s.total+'<span style="font-size:22px;color:var(--muted)">/21</span></div>'+
      '<div class="mini">wynik globalny PSQI<br>'+(c.s.total>5?"powyżej progu 5":"w granicach progu 5")+'</div></div></div>';
    h+='<div class="card"><span class="lab">Składowe (0–3)</span>';
    c.s.comps.forEach(function(v,i){
      h+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:7px">'+
        '<div style="flex:1;font-size:13px">'+COMPN[i]+'</div><div style="display:flex;gap:3px">';
      [0,1,2,3].forEach(function(n){
        h+='<div style="width:16px;height:7px;border-radius:2px;background:'+
          (n<=v?(v>=2?"var(--amber)":"var(--cool)"):"var(--line)")+';opacity:'+(n<=v?1:.5)+'"></div>';
      });
      h+='</div><div class="num" style="width:12px;font-size:13px;color:var(--muted);text-align:right">'+v+'</div></div>';
    });
    h+='</div>';
    var r=DIST.slice(1).map(function(x){return{lab:x[1],k:x[0],v:+c.p.q5[x[0]]||0};})
      .filter(function(x){return x.v>0;}).sort(function(a,b){return b.v-a.v;});
    h+='<div class="card"><span class="lab">Co budzi w nocy</span>';
    if(!r.length)h+='<div class="mini">Nie wskazano przyczyn.</div>';
    r.forEach(function(x){
      h+='<div style="margin-bottom:9px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">'+
        '<span>'+x.lab+(x.k==="j"&&c.p.q5jText?" — "+esc(c.p.q5jText):"")+'</span><span class="num" style="color:var(--muted)">'+x.v+'/3</span></div>'+
        '<div style="height:5px;background:var(--line);border-radius:3px"><div style="width:'+(x.v/3*100)+
        '%;height:5px;background:var(--amber);border-radius:3px"></div></div></div>';
    });
    h+='</div>';
  }
  if(!S.psqiOpen)return h+'<button class="btn" data-act="psqiopen">Wypełnij PSQI</button>';

  var p=S.p||(S.p=blankPsqi());
  h+='<div class="card">';
  h+='<div class="mb"><span class="lab">Miesiąc</span><input type="month" data-p="month" value="'+esc(p.month)+'"></div>';
  h+='<button class="ghost mb" data-act="prefill">Wypełnij godziny średnimi z dziennika</button>';
  h+='<div class="row mb"><div><span class="lab">1. Zwykle kładę się</span><input type="time" data-p="q1" value="'+esc(p.q1)+'"></div>'+
     '<div><span class="lab">3. Zwykle wstaję</span><input type="time" data-p="q3" value="'+esc(p.q3)+'"></div></div>';
  h+='<div class="row" style="margin-bottom:18px"><div><span class="lab">2. Zasypianie (min)</span><input type="number" inputmode="numeric" data-p="q2" value="'+esc(p.q2)+'"></div>'+
     '<div><span class="lab">4. Realny sen (godz.)</span><input type="number" inputmode="decimal" step="0.5" data-p="q4" value="'+esc(p.q4)+'"></div></div>';
  h+='<span class="lab" style="margin-bottom:10px">5. Jak często sen był zakłócony, bo…</span>';
  DIST.forEach(function(x){
    h+='<div style="margin-bottom:12px"><div style="font-size:13px;margin-bottom:6px">'+x[1]+'</div><div style="display:flex;gap:5px">';
    ["nigdy","<1×/tydz","1–2×","≥3×"].forEach(function(l,n){
      h+='<button class="pill'+(p.q5[x[0]]===n?" on":"")+'" data-act="q5" data-k="'+x[0]+'" data-v="'+n+'">'+l+'</button>';
    });
    h+='</div>';
    if(x[0]==="j"&&p.q5.j>0)h+='<input data-p="q5jText" placeholder="Jaki powód?" style="margin-top:7px;font-size:14px;font-variant-numeric:normal" value="'+esc(p.q5jText)+'">';
    h+='</div>';
  });
  [["q6","6. Ogólna jakość snu w ostatnim miesiącu",["Bardzo dobra","Raczej dobra","Raczej zła","Bardzo zła"]],
   ["q7","7. Jak często przyjmowałem leki nasenne",FREQ],
   ["q8","8. Trudność z utrzymaniem czujności — za kierownicą, przy posiłku, w rozmowie",FREQ],
   ["q9","9. Na ile trudno było zebrać zapał do działania",["Wcale nie było to problemem","Bardzo niewielki problem","Umiarkowany problem","Bardzo duży problem"]]
  ].forEach(function(q){
    h+='<span class="lab" style="margin-bottom:8px">'+q[1]+'</span>';
    q[2].forEach(function(l,n){
      h+='<button class="opt'+(p[q[0]]===n?" on":"")+'" data-act="qset" data-k="'+q[0]+'" data-v="'+n+'">'+l+'</button>';
    });
    h+='<div style="height:14px"></div>';
  });
  h+='<div style="display:flex;gap:10px"><button data-act="psqicancel" style="flex:1;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:11px;padding:14px;font-size:15px">Anuluj</button>'+
     '<button class="btn" data-act="psqisave" style="flex:2;border-radius:11px;padding:14px;font-size:15px">Policz wynik</button></div>';
  return h+'</div>';
}

/* ---------- eksport ---------- */
function exportCsv(){
  var head=["Data","Położyłem się","Zasnąłem","Wybudzenia (godziny)","Czas czuwania w nocy",
    "Ostatecznie wstałem","Drzemki","Pregabalina – godz.","Pregabalina – dawka","Trittico – godz.",
    "Trittico – dawka","Kawa – liczba","Ostatnia kawa – godz.","Samopoczucie rano (0–10)",
    "Senność rano (0–10)","Ocena nocy (0–10)","Uwagi","Czas w łóżku","Czas snu","Efektywność %"];
  var lines=[["DZIENNICZEK SNU – 30 DNI"],head];
  DATES.forEach(function(x){
    var e=S.diary[x];
    if(!filled(e)){lines.push([pl(x)].concat(new Array(head.length-1).fill("")));return;}
    var c=calc(e);
    lines.push([pl(x),e.bed||"",e.asleep||"",wakesTxt(e.wakes),c?dur(c.waso):"",e.up||"",e.naps||"",
      e.pregHour||"",e.pregDose||"",e.tritHour||"",e.tritDose||"",e.coffeeN||"",e.coffeeLast||"",
      e.mood,e.sleepiness,e.nightScore,e.notes||"",c?dur(c.tib):"",c?dur(c.tst):"",c?Math.round(c.eff):""]);
  });
  var csv=lines.map(function(r){return r.map(function(v){
    v=String(v==null?"":v);return '"'+v.replace(/"/g,'""')+'"';}).join(";");}).join("\r\n");
  var blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8;"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="Dzienniczek_snu_wypelniony.csv";
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
}

function download(name,text,type){
  var blob=new Blob([text],{type:type});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
}
function backup(){
  var stamp=new Date().toISOString().slice(0,10).replace(/-/g,"");
  download("Kopia_dzienniczek_snu_"+stamp+".json",
    JSON.stringify({v:1,zapisano:new Date().toISOString(),diary:S.diary,meds:S.meds,psqi:S.psqi},null,2),
    "application/json");
}
function restore(file){
  var r=new FileReader();
  r.onload=function(){
    try{
      var o=JSON.parse(r.result);
      if(!o||typeof o!=="object"||!o.diary)throw new Error("zły format");
      var n=Object.keys(o.diary).length;
      if(!confirm("Wczytać kopię z "+n+" dni? Obecne wpisy zostaną zastąpione."))return;
      S.diary=o.diary||{};S.meds=o.meds||{};S.psqi=o.psqi||[];
      save();render();
      alert("Wczytano "+n+" dni.");
    }catch(e){alert("Nie udało się odczytać pliku. Wybierz plik .json zapisany przyciskiem „Zapisz kopię”.");}
  };
  r.readAsText(file);
}

/* ---------- zdarzenia ---------- */
document.addEventListener("click",function(ev){
  var b=ev.target.closest("button[data-act]");if(!b)return;
  var a=b.dataset.act,v=b.dataset.v;
  if(a==="tab"){S.tab=v;render();}
  else if(a==="day"){S.sel=v;render();}
  else if(a==="addwake"){var d=cur();d.wakes=(d.wakes||[]).concat([{from:"",to:""}]);save();render();}
  else if(a==="delwake"){var d2=cur();d2.wakes.splice(+v,1);save();render();}
  else if(a==="meds"){S.medsOpen=!S.medsOpen;render();}
  else if(a==="savemeds"){var d3=cur();S.meds={pregHour:d3.pregHour,pregDose:d3.pregDose,tritHour:d3.tritHour,tritDose:d3.tritDose};
    S.medsOpen=false;save();render();}
  else if(a==="export"){exportCsv();}
  else if(a==="backup"){backup();}
  else if(a==="restore"){
    var f=document.getElementById("restoreFile");
    f.onchange=function(){if(f.files&&f.files[0])restore(f.files[0]);f.value="";};
    f.click();
  }
  else if(a==="psqiopen"){S.psqiOpen=true;S.p=blankPsqi();render();}
  else if(a==="psqicancel"){S.psqiOpen=false;S.p=null;render();}
  else if(a==="q5"){S.p.q5[b.dataset.k]=+v;render();}
  else if(a==="qset"){S.p[b.dataset.k]=+v;render();}
  else if(a==="prefill"){
    var rows=DATES.map(function(x){var e=S.diary[x];return filled(e)?{e:e,c:calc(e)}:null;}).filter(function(r){return r&&r.c;});
    if(!rows.length){alert("Brak wypełnionych nocy w dzienniku.");return;}
    var avg=function(f){return rows.reduce(function(s,r){return s+f(r);},0)/rows.length;};
    S.p.q1=m2t(avg(function(r){return r.c.bedAbs;}));
    S.p.q2=String(Math.round(avg(function(r){return r.c.sol;})));
    S.p.q3=m2t(avg(function(r){return r.c.bedAbs+r.c.tib;}));
    S.p.q4=(avg(function(r){return r.c.tst;})/60).toFixed(1);
    render();
  }
  else if(a==="psqisave"){
    S.psqi=S.psqi.filter(function(x){return x.month!==S.p.month;}).concat([S.p]);
    S.psqiOpen=false;S.p=null;save();render();
  }
});

document.addEventListener("input",function(ev){
  var t=ev.target;
  if(t.dataset.f!==undefined&&t.dataset.f){
    var d=cur(); d[t.dataset.f]=t.type==="range"?+t.value:t.value; save();
    if(t.type==="range"){
      var l=document.getElementById("lab-"+t.dataset.f);
      if(l)l.textContent=t.dataset.lab+" — "+t.value+"/10";
    }
    refreshLive();
  } else if(t.dataset.w!==undefined&&t.dataset.w!==""){
    var d2=cur(); d2.wakes[+t.dataset.w][t.dataset.side]=t.value; save(); refreshLive();
  } else if(t.dataset.p){
    S.p[t.dataset.p]=t.value;
  }
});

function refreshLive(){
  var st=document.getElementById("stats");
  if(st)st.outerHTML=viewStats();
  var tl=document.getElementById("tl");
  if(tl)tl.outerHTML=viewTimeline();
}

/* ---------- start ---------- */
load();
var today=new Date().toISOString().slice(0,10);
S.sel=DATES.indexOf(today)>=0?today:DATES[0];
render();
</script>
